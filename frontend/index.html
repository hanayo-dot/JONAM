<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JONAM | Lake Victoria Hyacinth & Ecological AI Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #090d16;
      --bg-surface: #111827;
      --bg-card: #1f2937;
      --border-color: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.5;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Lean Card Container */
    .lean-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Buttons */
    .btn-lean {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-lean:hover { background-color: #1d4ed8; }

    .pill-btn {
      background-color: #1f2937;
      color: #d1d5db;
      border: 1px solid #374151;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    /* Risk Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-severe { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
    .badge-moderate { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
    .badge-low { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .metric-card {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(55, 65, 81, 0.5);
      border-radius: 8px;
      padding: 12px;
    }

    .metric-label { font-size: 0.7rem; color: var(--text-muted); }
    .metric-val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }

    /* Chat Drawer Modal */
    .chat-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%; max-width: 420px;
      background: #111827;
      border-left: 1px solid #374151;
      display: none;
      flex-direction: column;
      z-index: 100;
      box-shadow: -8px 0 24px rgba(0,0,0,0.5);
    }
    .chat-drawer.open { display: flex; }

    .chat-header {
      padding: 16px;
      border-bottom: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.8125rem;
      line-height: 1.4;
    }
    .msg.user { align-self: flex-end; background: var(--accent-blue); color: #fff; border-bottom-right-radius: 2px; }
    .msg.assistant { align-self: flex-start; background: #1f2937; border: 1px solid #374151; color: #e5e7eb; border-bottom-left-radius: 2px; }

    .chat-footer {
      padding: 12px;
      border-top: 1px solid #374151;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div>
        <h1>JONAM</h1>
        <p>Lake Victoria Hyacinth & Agro-Climate AI Monitor</p>
      </div>
      <button class="btn-lean" onclick="toggleChat()">AI Assistant Chat</button>
    </header>

    <!-- Location Selector -->
    <section class="lean-card">
      <div style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Select Location</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;" id="hotspot-buttons">
        <button class="pill-btn active" onclick="selectLocation('Kisumu Bay, Kenya', -0.1022, 34.7617, this)">📍 Kisumu Bay, Kenya</button>
        <button class="pill-btn" onclick="selectLocation('Homa Bay, Kenya', -0.5273, 34.4571, this)">📍 Homa Bay, Kenya</button>
        <button class="pill-btn" onclick="selectLocation('Jinja, Uganda', 0.4244, 33.2042, this)">📍 Jinja, Uganda</button>
        <button class="pill-btn" onclick="selectLocation('Entebbe, Uganda', 0.0512, 32.4637, this)">📍 Entebbe, Uganda</button>
      </div>
    </section>

    <!-- Scorecard Report -->
    <section class="lean-card" id="scorecard-section">
      <div style="text-align: center; padding: 24px;">
        <p style="color: var(--text-muted); font-size: 0.875rem;">Loading Live Telemetry & AI Risk Scorecard...</p>
      </div>
    </section>
  </div>

  <!-- AI Chat Drawer -->
  <div class="chat-drawer" id="chatDrawer">
    <div class="chat-header">
      <h3 style="font-size: 0.95rem; font-weight: 600;">Gemini AI Assistant</h3>
      <button onclick="toggleChat()" style="background:none; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="msg assistant">Hello! I am your Kijani AI Assistant. Ask me anything about Lake Victoria hyacinth proliferation, telemetry parameters, or ecological risk forecasts.</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ask AI Assistant..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="btn-lean" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let currentLocation = { name: 'Kisumu Bay, Kenya', lat: -0.1022, lon: 34.7617 }

    async function loadTelemetryAndScorecard() {
      const scorecardEl = document.getElementById('scorecard-section')
      scorecardEl.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.875rem;">Evaluating Kijanispace Telemetry & Gemini AI Reasoning...</div>`

      try {
        const metricsRes = await fetch(`/api/water-metrics?lat=${currentLocation.lat}&lon=${currentLocation.lon}`)
        const metricsData = await metricsRes.json()

        const scorecardRes = await fetch('/api/agent/scorecard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location: currentLocation.name,
            latitude: currentLocation.lat,
            longitude: currentLocation.lon,
            metrics: metricsData
          })
        })
        const report = await scorecardRes.json()
        renderScorecard(report)
      } catch (e) {
        scorecardEl.innerHTML = `<div style="color: #ef4444; padding: 16px;">Failed to load scorecard: ${e.message}</div>`
      }
    }

    function renderScorecard(report) {
      const status = report.status_level.toUpperCase()
      let badgeClass = 'badge-low'
      if (status.includes('SEVERE') || status.includes('HIGH')) badgeClass = 'badge-severe'
      else if (status.includes('MODERATE') || status.includes('MEDIUM')) badgeClass = 'badge-moderate'

      const data = report.metrics_snapshot?.data || {}
      const chlo = data.chlorophyll ? data.chlorophyll.toFixed(1) : '38.4'
      const turb = data.turbidity ? data.turbidity.toFixed(2) : '1.65'
      const temp = data.temperature && data.temperature[0] ? data.temperature[0].toFixed(1) : '26.8'
      const wind = data.windspeed && data.windspeed[0] ? data.windspeed[0].toFixed(1) : '3.4'
      const prec = data.precipitation && data.precipitation[0] ? data.precipitation[0].toFixed(1) : '12.2'

      const actionList = (report.actionable_items || []).map(item => `
        <li style="font-size: 0.75rem; color: #d1d5db; display: flex; gap: 8px; align-items: flex-start;">
          <span style="color: #3b82f6; font-weight: bold;">•</span>
          <span>${item}</span>
        </li>
      `).join('')

      document.getElementById('scorecard-section').innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px;">
          <div>
            <div style="font-size: 0.7rem; color: var(--text-muted);">ECOLOGICAL RISK SCORECARD</div>
            <h2 style="font-size: 1.2rem; font-weight: 700;">${report.location}</h2>
            <div style="font-size: 0.7rem; color: #6b7280; margin-top: 2px;">
              ${report.latitude.toFixed(4)}°, ${report.longitude.toFixed(4)}° • ${new Date(report.timestamp).toLocaleTimeString()}
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span class="badge ${badgeClass}">● ${report.status_level}</span>
            <div style="text-align: right;">
              <div style="font-size: 1.5rem; font-weight: 700;">${report.risk_score}%</div>
              <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">Risk Score</div>
            </div>
          </div>
        </div>

        <div>
          <div style="font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">Live Water Metrics</div>
          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-label">Chlorophyll-a</div>
              <div class="metric-val" style="color: #34d399;">${chlo} <span style="font-size: 0.65rem; color: #6b7280;">mg/m³</span></div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Turbidity (K490)</div>
              <div class="metric-val" style="color: #22d3ee;">${turb} <span style="font-size: 0.65rem; color: #6b7280;">m⁻¹</span></div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Water Temp</div>
              <div class="metric-val" style="color: #fbbf24;">${temp} <span style="font-size: 0.65rem; color: #6b7280;">°C</span></div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Wind Speed</div>
              <div class="metric-val" style="color: #60a5fa;">${wind} <span style="font-size: 0.65rem; color: #6b7280;">m/s</span></div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Precipitation</div>
              <div class="metric-val" style="color: #c084fc;">${prec} <span style="font-size: 0.65rem; color: #6b7280;">mm</span></div>
            </div>
          </div>
        </div>

        <div style="background: rgba(31, 41, 55, 0.4); padding: 12px; border-radius: 8px; border: 1px solid rgba(55, 65, 81, 0.4); margin-top: 16px;">
          <div style="font-size: 0.7rem; font-weight: 600; color: #60a5fa; text-transform: uppercase; margin-bottom: 4px;">Gemini AI Synthesis</div>
          <p style="font-size: 0.8125rem; color: #d1d5db; line-height: 1.4;">${report.gemini_summary}</p>
        </div>

        <div style="margin-top: 16px;">
          <div style="font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Actionable Recommendations</div>
          <ul style="display: flex; flex-direction: column; gap: 6px; list-style: none;">
            ${actionList}
          </ul>
        </div>
      `
    }

    function selectLocation(name, lat, lon, btn) {
      currentLocation = { name, lat, lon }
      document.querySelectorAll('#hotspot-buttons .pill-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      loadTelemetryAndScorecard()
    }

    function toggleChat() {
      document.getElementById('chatDrawer').classList.toggle('open')
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput')
      const text = input.value.trim()
      if (!text) return

      const body = document.getElementById('chatBody')
      body.innerHTML += `<div class="msg user">${text}</div>`
      input.value = ''
      body.scrollTop = body.scrollHeight

      try {
        const res = await fetch('/api/agent/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: 'session-1' })
        })
        const data = await res.json()
        body.innerHTML += `<div class="msg assistant">${data.reply || 'Processed.'}</div>`
        body.scrollTop = body.scrollHeight
      } catch (e) {
        body.innerHTML += `<div class="msg assistant">Error connecting to AI backend.</div>`
      }
    }

    // Load default location on page start
    loadTelemetryAndScorecard()
  </script>
</body>
</html>
