<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kijani MVP</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; max-width: 980px; }
      input[type=text], select { width: 100%; max-width: 720px; padding: 8px; margin: 4px 0; }
      button { padding: 10px 14px; margin-right: 8px; }
      .item { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
      .item h4 { margin: 0 0 8px 0; }
      .item button { margin-top: 8px; }
      .result img { max-width: 100%; border: 1px solid #ddd; margin-top: 8px; }
      code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h2>Lake Victoria Hyacinth Detector (MVP)</h2>
    <p>This MVP uses the Kijanispace EO endpoints to search Sentinel-2 STAC items and detect green vegetation in preview assets.</p>
    <div>
      <button id="search">Search Latest Lake Victoria Items</button>
      <button id="locations">Get Kijanispace Locations</button>
      <button id="metrics">Load Water Metrics</button>
    </div>
    <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
      <label for="lat" style="margin:0; font-size:0.95rem;">Lat:</label>
      <input id="lat" type="text" value="-1.0" style="width:100px;" />
      <label for="lon" style="margin:0; font-size:0.95rem;">Lon:</label>
      <input id="lon" type="text" value="33.0" style="width:100px;" />
    </div>
    <div id="status" style="margin-top:16px; color:#333"></div>
    <h3>Water metrics</h3>
    <div id="metrics-result" class="result"><p>No metrics loaded yet.</p></div>
    <h3>Search results</h3>
    <div id="results"></div>
    <h3>Detection result</h3>
    <div id="result" class="result">
      <p>No result yet.</p>
    </div>

    <script>
      const statusEl = document.getElementById('status')
      const resultsEl = document.getElementById('results')
      const resultEl = document.getElementById('result')

      document.getElementById('search').onclick = async () => {
        statusEl.textContent = 'Searching Kijanispace...'
        resultsEl.innerHTML = ''
        resultEl.innerHTML = '<p>No result yet.</p>'
        try {
          const res = await fetch('/api/stac-search')
          if (!res.ok) {
            throw new Error('Search failed: ' + res.status)
          }
          const data = await res.json()
          if (!data.features || data.features.length === 0) {
            resultsEl.innerHTML = '<p>No items found.</p>'
            statusEl.textContent = ''
            return
          }
          statusEl.textContent = `Found ${data.features.length} item(s).`;
          data.features.forEach(feature => {
            const itemEl = document.createElement('div')
            itemEl.className = 'item'
            const title = document.createElement('h4')
            title.textContent = feature.id
            itemEl.appendChild(title)
            const bbox = document.createElement('p')
            bbox.innerHTML = '<strong>BBOX:</strong> ' + (feature.bbox ? feature.bbox.join(', ') : 'N/A')
            itemEl.appendChild(bbox)
            const previewLink = (feature.links || []).find(link => link.rel === 'preview')
            const previewUrl = previewLink ? previewLink.href : null
            if (previewUrl) {
              const p = document.createElement('p')
              p.innerHTML = `<strong>Preview URL:</strong> <a href="${previewUrl}" target="_blank">open</a>`
              itemEl.appendChild(p)
            }
            const detectButton = document.createElement('button')
            detectButton.textContent = 'Detect from preview'
            detectButton.disabled = !previewUrl
            detectButton.onclick = () => runDetect(previewUrl)
            itemEl.appendChild(detectButton)
            if (!previewUrl) {
              const assets = feature.assets || {}
              const assetUrls = Object.entries(assets)
                .filter(([key, val]) => key.toLowerCase().includes('preview') || key.toLowerCase().includes('thumbnail'))
                .map(([_, val]) => val.href)
              if (assetUrls.length) {
                const p = document.createElement('p')
                p.innerHTML = '<strong>Asset preview:</strong> ' + assetUrls.map(u => `<a href="${u}" target="_blank">${u}</a>`).join('<br/>')
                itemEl.appendChild(p)
                const altButton = document.createElement('button')
                altButton.textContent = 'Detect from first asset preview'
                altButton.onclick = () => runDetect(assetUrls[0])
                itemEl.appendChild(altButton)
              }
            }
            resultsEl.appendChild(itemEl)
          })
        } catch (e) {
          statusEl.textContent = 'Error: ' + e.message
          resultsEl.innerHTML = ''
        }
      }

      document.getElementById('locations').onclick = async () => {
        statusEl.textContent = 'Fetching locations...'
        resultsEl.innerHTML = ''
        resultEl.innerHTML = '<p>No result yet.</p>'
        try {
          const res = await fetch('/api/locations')
          const data = await res.json()
          resultsEl.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`
          statusEl.textContent = 'Locations loaded.'
        } catch (e) {
          statusEl.textContent = 'Error: ' + e.message
        }
      }

      document.getElementById('metrics').onclick = async () => {
        const lat = document.getElementById('lat').value.trim()
        const lon = document.getElementById('lon').value.trim()
        statusEl.textContent = 'Loading water metrics...'
        try {
          const res = await fetch(`/api/water-metrics?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`)
          if (!res.ok) {
            throw new Error('Metrics request failed: ' + res.status)
          }
          const data = await res.json()
          const metricsEl = document.getElementById('metrics-result')
          metricsEl.innerHTML = `
            <p><strong>Location:</strong> ${data.location.latitude}, ${data.location.longitude} (${data.location.timezone})</p>
            <p><strong>Precipitation units:</strong> ${data.units.precipitation}</p>
            <p><strong>Temperature units:</strong> ${data.units.temperature}</p>
            <p><strong>Wind speed units:</strong> ${data.units.windspeed}</p>
            <p><strong>Turbidity units:</strong> ${data.units.turbidity}</p>
            <p><strong>Chlorophyll units:</strong> ${data.units.chlorophyll}</p>
            <pre>${JSON.stringify(data.data, null, 2)}</pre>
          `
          statusEl.textContent = 'Water metrics loaded.'
        } catch (e) {
          statusEl.textContent = 'Error: ' + e.message
          document.getElementById('metrics-result').innerHTML = '<p>No metrics loaded yet.</p>'
        }
      }

      async function runDetect(url) {
        if (!url) return
        statusEl.textContent = 'Detecting vegetation...'
        resultEl.innerHTML = '<p>Processing...</p>'
        try {
          const res = await fetch('/detect', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({image_url: url})
          })
          if (!res.ok) {
            const err = await res.json().catch(() => null)
            throw new Error(err?.error || res.statusText)
          }
          const blob = await res.blob()
          const imgUrl = URL.createObjectURL(blob)
          resultEl.innerHTML = `<p>Overlay PNG (green = detected vegetation)</p><img src="${imgUrl}" alt="mask" />`
          statusEl.textContent = 'Detection complete.'
        } catch (e) {
          statusEl.innerHTML = `<p>Error: ${e.message}</p>`
          statusEl.textContent = ''
        }
      }
    </script>
  </body>
</html>
